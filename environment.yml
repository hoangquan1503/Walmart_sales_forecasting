name: walmart-sales-forecasting

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Core
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy

  # Machine Learning
  - scikit-learn=1.5.1
  - lightgbm=4.3.0
  - optuna=3.6.1

  # Visualization
  - matplotlib=3.8.4
  - seaborn=0.13.2

  # Notebook
  - jupyter
  - ipykernel

  # Pip packages
  - pip
  - pip:
      - prophet==1.1.6
      - cmdstanpy>=1.2.0,<2.0
      - shap==0.44.1
      - joblib==1.4.2
      - pyarrow>=15.0,<22.0